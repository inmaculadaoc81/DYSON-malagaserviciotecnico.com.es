 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7FB2E0" stop-opacity=".75"/><stop offset=".35" stop-color="#EAF3FB" stop-opacity=".55"/><stop offset=".7" stop-color="#B7D3EE" stop-opacity=".45"/><stop offset="1" stop-color="#3F7DB8" stop-opacity=".8"/></linearGradient>
