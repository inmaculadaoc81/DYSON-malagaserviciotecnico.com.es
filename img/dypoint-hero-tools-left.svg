<defs>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E1EE"/></linearGradient>
 <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D6E6F5"/><stop offset="1" stop-color="#A2C6E8"/></linearGradient>
 <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7FB2E0"/><stop offset="1" stop-color="#3F7DB8"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4A556B"/><stop offset=".3" stop-color="#DDE4F0"/><stop offset=".42" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#9AA6BA"/><stop offset="1" stop-color="#3B4558"/></linearGradient>
 <linearGradient id="chromeH" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4A556B"/><stop offset=".3" stop-color="#DDE4F0"/><stop offset=".42" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#9AA6BA"/><stop offset="1" stop-color="#3B4558"/></linearGradient>
