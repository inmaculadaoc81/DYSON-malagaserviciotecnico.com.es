 <linearGradient id="orangeV" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A8321F"/><stop offset=".4" stop-color="#FF8A78"/><stop offset="1" stop-color="#CF4430"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1B2334"/><stop offset=".4" stop-color="#46526B"/><stop offset="1" stop-color="#1B2334"/></linearGradient>
 <radialGradient id="disc" cx=".38" cy=".32" r=".8"><stop stop-color="#3E6CA3"/><stop offset=".55" stop-color="#0B2545"/><stop offset="1" stop-color="#061A33"/></radialGradient>
